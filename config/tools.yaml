# Tool paths and invocation flags for the multi-analyzer gate.
# static.py resolves each tool as $<TOOL>_PATH -> this path (relative = repo
# root) -> name on $PATH, so these need not match your machine.
# Cppcheck Premium is commercial and gitignored: set CPPCHECK_PATH or put it in
# ./cppcheckpremium/. Without it the gate loses ~96% of its findings.
tools:
  gcc:
    path: /usr/local/bin/gcc-15          # Homebrew gcc (real GCC, needed for -fanalyzer)
    compile_flags: ["-c", "-w"]          # compile gate -> .o
    analyzer_flags: ["-fanalyzer", "-w"]
    report_suffix: ".gcc.txt"
  clang:
    path: /usr/bin/clang
    analyzer_flags: ["--analyze", "-Xclang", "-analyzer-config", "-Xclang", "crosscheck-with-z3=true", "-w"]
    report_suffix: ".clang.txt"
  cppcheck:
    path: cppcheckpremium/cppcheck       # repo-relative; override with CPPCHECK_PATH
    analyzer_flags: ["--premium=bughunting", "--enable=warning,style,performance,portability"]
    report_suffix: ".cppcheck.txt"
  flawfinder:
    path: /usr/local/bin/flawfinder
    analyzer_flags: []
    report_suffix: ".flawfinder.txt"

# Dynamic analysis
dynamic:
  sanitizers: ["address", "undefined"]
  timeout_s: 5
  mem_limit_mb: 512
  fuzzer: afl++                    # user decision; libFuzzer fallback available
  # AFL++ 5.02c built locally with TEST_MMAP=1 (architecture.md 7.7); build/ is
  # gitignored, so these only resolve where --fuzz is actually used.
  afl_bin: build/afl/bin/afl-fuzz
  afl_cc: build/afl/bin/afl-clang-fast
  afl_lib: build/afl/lib/afl       # AFL_PATH (compiler-rt + passes)
  fuzz_budget_s: 60
  seed_corpus_from_tests: true

# Report file suffixes consumed by comment injection, grouped by channel.
feedback_channels:
  static: [".gcc.txt", ".clang.txt", ".cppcheck.txt", ".flawfinder.txt"]
  dynamic: [".asan.txt", ".fuzz.txt", ".test.txt"]
