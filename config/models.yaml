# Model registry for the FSE 2027 extension.
# NOTE: exact model IDs must be re-verified and pinned at run time (record
# retrieval dates for the paper's artifact). These are sensible initial pins.
# api_key_env references an environment variable; keys never live in this file.
models:
  # ---- OpenAI via Replicate (route decided 2026-09-03: api.openai.com is
  #      region-blocked and no proxy is available; Replicate hosts the exact
  #      same flagship. Verified via GET /v1/collections/language-models:
  #      openai/gpt-5.6-{sol,terra,luna}. Input params: prompt,
  #      system_prompt, max_completion_tokens, reasoning_effort, verbosity —
  #      NO temperature/top_p (host does not expose sampling); the adapter
  #      drops and records them. reasoning_effort maps from extra_body.) ----
  - id: openai-gpt56-sol
    provider: replicate
    model_id: openai/gpt-5.6-sol
    api_key_env: REPLICATE_API_TOKEN
    concurrency: 1  # Replicate account throttled to 6 predictions/min (2026-09-03)
    reasoning: false
    extra_body:
      reasoning_effort: "none"
  - id: openai-gpt56-sol-thinking
    provider: replicate
    model_id: openai/gpt-5.6-sol
    api_key_env: REPLICATE_API_TOKEN
    concurrency: 1  # Replicate account throttled to 6 predictions/min (2026-09-03)
    reasoning: true
    extra_body:
      reasoning_effort: high
    max_tokens: 16384

  # ---- Anthropic Claude Fable 5 via Replicate (user-selected flagship,
  #      2026-09-03; verified anthropic/claude-fable-5 exists via
  #      GET /v1/models/anthropic/claude-fable-5). Input params: prompt,
  #      system_prompt, max_tokens (MINIMUM 1024 — adapter clamps) — no
  #      sampling params, no thinking toggle: Fable 5 uses ADAPTIVE thinking,
  #      so the base/thinking ablation is NOT separable on this host; only
  #      the base entry is registered. Token counts come from
  #      prediction.metrics (input/output_token_count).) ----
  - id: claude-fable-5
    provider: replicate
    model_id: anthropic/claude-fable-5
    api_key_env: REPLICATE_API_TOKEN
    concurrency: 1  # Replicate account throttled to 6 predictions/min (2026-09-03)
    reasoning: false

  # ---- Google Gemini 3.1 Pro via Replicate (verified google/gemini-3.1-pro,
  #      2026-09-03). Input params: prompt, system_instruction,
  #      max_output_tokens, temperature, top_p (the ONLY host exposing
  #      sampling), thinking_level enum {low, medium, high} — there is NO
  #      "off": the "base" variant runs thinking_level=low, the thinking
  #      variant high. Document this asymmetry in the paper.) ----
  - id: gemini-3-pro
    provider: replicate
    model_id: google/gemini-3.1-pro
    api_key_env: REPLICATE_API_TOKEN
    concurrency: 1  # Replicate account throttled to 6 predictions/min (2026-09-03)
    reasoning: false
    extra_body:
      thinking_level: low
  - id: gemini-3-pro-thinking
    provider: replicate
    model_id: google/gemini-3.1-pro
    api_key_env: REPLICATE_API_TOKEN
    concurrency: 1  # Replicate account throttled to 6 predictions/min (2026-09-03)
    reasoning: true
    extra_body:
      thinking_level: high
    max_tokens: 16384

  # ---- DeepSeek (V4 lineup; verified via GET /v1/models on 2026-08-31.
  #      Legacy aliases deepseek-chat/deepseek-reasoner now resolve to
  #      v4-flash; the flagship is deepseek-v4-pro, a hybrid reasoning model
  #      whose thinking is disabled via the "thinking" extra body.) ----
  - id: deepseek-v4-flash
    provider: deepseek
    model_id: deepseek-v4-flash
    api_key_env: DEEPSEEK_API_KEY
    base_url: https://api.deepseek.com
    reasoning: false
  - id: deepseek-v4-pro
    provider: deepseek
    model_id: deepseek-v4-pro
    api_key_env: DEEPSEEK_API_KEY
    base_url: https://api.deepseek.com
    reasoning: false
    extra_body:
      thinking:
        type: disabled
  - id: deepseek-v4-pro-thinking
    provider: deepseek
    model_id: deepseek-v4-pro
    api_key_env: DEEPSEEK_API_KEY
    base_url: https://api.deepseek.com
    reasoning: true
    # 16k so long reasoning chains don't exhaust the budget before content
    # is emitted (empty-content responses raise + retry client-side).
    max_tokens: 16384

  # ---- Qwen (DashScope compatible-mode) ----
  - id: qwen-max
    provider: dashscope
    model_id: qwen-max
    api_key_env: DASHSCOPE_API_KEY
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    reasoning: false
  - id: qwq-plus
    provider: dashscope
    model_id: qwq-plus
    api_key_env: DASHSCOPE_API_KEY
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    reasoning: true
    max_tokens: 8192

  # ---- Kimi (Moonshot) via DashScope (route decided 2026-09-03: user routes
  #      kimi/glm through the Alibaba Bailian (DashScope) account. Verified
  #      via probes on 2026-09-03: 'kimi-k3' present; the host REJECTS
  #      temperature/top_p on ALL paths (thinking-first model — the temp/
  #      top_p grid is NOT runnable for kimi); base/thinking split via
  #      extra_body enable_thinking (verified: false -> no reasoning_content,
  #      true -> reasoning_content present).) ----
  - id: kimi-k3
    provider: dashscope
    model_id: kimi-k3
    api_key_env: DASHSCOPE_API_KEY
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    reasoning: false
    no_sampling: true
    extra_body:
      enable_thinking: false
  - id: kimi-k3-thinking
    provider: dashscope
    model_id: kimi-k3
    api_key_env: DASHSCOPE_API_KEY
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    reasoning: true
    extra_body:
      enable_thinking: true
    max_tokens: 16384

  # ---- GLM (Zhipu) via DashScope (route decided 2026-09-03. Verified on
  #      2026-09-03: glm-5.1 (pinned), glm-5.2, glm-5.2-fast-preview,
  #      ZHIPU/GLM-5.3, ZHIPU/GLM-5.3-Flash, glm-5, glm-4.7 — NOTE: newer
  #      GLM-5.2/5.3 exist; pin kept at glm-5.1 per the 2026-08-31 lineup.
  #      Sampling params ARE accepted; the model thinks BY DEFAULT, so the
  #      base entry must pass enable_thinking: false (verified: reasoning
  #      off/on works).) ----
  - id: glm-5.1
    provider: dashscope
    model_id: glm-5.1
    api_key_env: DASHSCOPE_API_KEY
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    reasoning: false
    extra_body:
      enable_thinking: false
  - id: glm-5.1-thinking
    provider: dashscope
    model_id: glm-5.1
    api_key_env: DASHSCOPE_API_KEY
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    reasoning: true
    extra_body:
      enable_thinking: true
    max_tokens: 16384
